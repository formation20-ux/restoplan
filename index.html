<body class="bg-[#f9f8f4]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;

        const firebaseConfig = {
          apiKey: "AIzaSyB8VqGEdm5xpSiM1CTadsbN6ZDUVMg7OEM",
          authDomain: "restoplanmjo.firebaseapp.com",
          projectId: "restoplanmjo",
          storageBucket: "restoplanmjo.firebasestorage.app",
          messagingSenderId: "77400415439",
          appId: "1:77400415439:web:bee9c8651f0acf23c6ebba",
          measurementId: "G-RGSEJPZJMJ"
        };
        const appId = 'restoplan-default';

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const TOOLS = {
            PAN: { id: 'pan', name: 'Déplacer', icon: 'fas fa-hand', color: 'bg-transparent' },
            WALL: { id: 'wall', name: 'Mur', icon: 'fas fa-square', color: 'bg-stone-600' },
            TRASH: { id: 'trash', name: 'Poubelle', icon: 'fas fa-trash-alt', color: 'bg-[#5c4f42]' },
            TABLE: { id: 'table', name: 'Table', icon: 'fas fa-circle', color: 'bg-[#c17a23]' },
            DOOR: { id: 'door', name: 'Porte', icon: 'fas fa-door-open', color: 'bg-stone-400' },
            CHAIR: { id: 'chair', name: 'Chaise', icon: 'fas fa-chair', color: 'bg-transparent' },
            STOOL: { id: 'stool', name: 'Tabouret', icon: 'fas fa-circle-dot', color: 'bg-transparent' },
            BENCH: { id: 'bench', name: 'Banc', icon: 'fas fa-couch', color: 'bg-transparent' },
            KIOSK: { id: 'kiosk', name: 'Borne', icon: 'fas fa-tablet-screen-button', color: 'bg-stone-800' },
            STAIRS: { id: 'stairs', name: 'Escalier', icon: 'fas fa-stairs', color: 'bg-stone-800' },
            START: { id: 'start', name: 'Départ', icon: 'fas fa-map-marker-alt', color: 'bg-[#2a7a6c]' },
            ZONE: { id: 'zone', name: 'Zone', icon: 'fas fa-map', color: 'bg-transparent' },
            BUCKET: { id: 'bucket', name: 'Remplir', icon: 'fas fa-fill-drip', color: 'bg-transparent' },
            ERASER: { id: 'eraser', name: 'Gomme', icon: 'fas fa-eraser', color: 'bg-red-400' },
        };

        const generateEmptyLayout = () => {
            return {
                cols: 30, rows: 20,
                floors: [{ id: 'f1', name: 'RDC', order: 0, cols: 30, rows: 20 }],
                cells: {}, 
                zones: [{ id: 'z1', name: 'Salle', color: '#e8c9a5' }], 
                startPos: null
            };
        };

        function App() {
            const [loading, setLoading] = useState(true);
            const [mode, setMode] = useState('edit'); 
            const [layout, setLayout] = useState(generateEmptyLayout());

            const [currentFloorId, setCurrentFloorId] = useState('f1');
            const [currentTool, setCurrentTool] = useState('pan');
            
            const [selectedZoneId, setSelectedZoneId] = useState('z1');
            const [activeTableId, setActiveTableId] = useState('101'); 
            const [isRoundTable, setIsRoundTable] = useState(false);
            const [activeStairId, setActiveStairId] = useState('A'); 
            const [activeKioskId, setActiveKioskId] = useState('1');
            const [kioskOrientation, setKioskOrientation] = useState('N');

            const [isManagingZones, setIsManagingZones] = useState(false);
            const [newZoneName, setNewZoneName] = useState('');
            const [newZoneColor, setNewZoneColor] = useState('#c17a23');
            
            const [isManagingFloors, setIsManagingFloors] = useState(false);
            const [newFloorName, setNewFloorName] = useState('');

            const [isDrawing, setIsDrawing] = useState(false);
            const [dragStart, setDragStart] = useState(null);
            const [dragCurrent, setDragCurrent] = useState(null);

            const [drawError, setDrawError] = useState(null);
            const [benchMergePrompt, setBenchMergePrompt] = useState(null);
            
            const [targetTable, setTargetTable] = useState('');
            const [path, setPath] = useState([]); 
            const [pathMessage, setPathMessage] = useState(null);
            const [pathInstructions, setPathInstructions] = useState([]);
            const [zoom, setZoom] = useState(1);
            const [rotation, setRotation] = useState(0); 

            const mapContainerRef = useRef(null);
            const [baseScale, setBaseScale] = useState(1);
            const saveTimeoutRef = useRef(null);
            const rushTimeoutRef = useRef(null); 

            useEffect(() => {
                if (drawError) {
                    const t = setTimeout(() => setDrawError(null), 3500);
                    return () => clearTimeout(t);
                }
            }, [drawError]);

            useEffect(() => {
                const updateScale = () => {
                    if (mapContainerRef.current) {
                        const { clientWidth, clientHeight } = mapContainerRef.current;
                        const floor = layout.floors.find(f => f.id === currentFloorId) || layout.floors[0];
                        if (floor) {
                            const cols = floor.cols || layout.cols || 25;
                            const rows = floor.rows || layout.rows || 15;
                            const rw = rotation === 90 || rotation === 270 ? rows : cols;
                            const rh = rotation === 90 || rotation === 270 ? cols : rows;
                            const scaleX = clientWidth / (rw * 40);
                            const scaleY = clientHeight / (rh * 40);
                            setBaseScale(Math.min(scaleX, scaleY) * 0.95);
                        }
                    }
                };
                updateScale();
                window.addEventListener('resize', updateScale);
                const t = setTimeout(updateScale, 150); 
                return () => { window.removeEventListener('resize', updateScale); clearTimeout(t); };
            }, [layout.floors, currentFloorId, layout.cols, layout.rows, rotation]);

            useEffect(() => {
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('restaurant').doc('layout');
                const unsub = docRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (!data.cells || Object.keys(data.cells).length === 0) {
                            const emptyLayout = generateEmptyLayout();
                            setLayout(emptyLayout);
                            docRef.set(emptyLayout).catch(e => console.error(e));
                        } else {
                            setLayout(data);
                            if (data.floors && data.floors.length > 0 && !data.floors.find(f => f.id === currentFloorId)) {
                                setCurrentFloorId(data.floors[0].id);
                            }
                        }
                    } else {
                        const emptyLayout = generateEmptyLayout();
                        setLayout(emptyLayout);
                        docRef.set(emptyLayout).catch(e => console.error(e));
                    }
                    setLoading(false);
                }, (error) => {
                    console.error("Snapshot error:", error);
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            const saveLayout = useCallback((newLayout) => {
                setLayout(newLayout);
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('restaurant').doc('layout');
                        await docRef.set(newLayout);
                    } catch (error) { console.error("Save error:", error); }
                }, 500);
            }, []);

            const modifyGrid = useCallback((edge, change) => {
                setLayout(prev => {
                    const currentFloorIdx = prev.floors.findIndex(f => f.id === currentFloorId);
                    if (currentFloorIdx === -1) return prev;

                    const floor = prev.floors[currentFloorIdx];
                    const cCols = floor.cols || prev.cols || 25;
                    const cRows = floor.rows || prev.rows || 15;

                    let newCols = cCols;
                    let newRows = cRows;
                    const newCells = {};
                    let newStartPos = prev.startPos;

                    if (edge === 'left' || edge === 'right') {
                        newCols = Math.max(5, cCols + change);
                        if (newCols === cCols) return prev;
                    } else {
                        newRows = Math.max(5, cRows + change);
                        if (newRows === cRows) return prev;
                    }

                    const dx = (edge === 'left') ? change : 0;
                    const dy = (edge === 'top') ? change : 0;

                    Object.keys(prev.cells).forEach(key => {
                        const [f, xStr, yStr] = key.split(':');
                        let x = parseInt(xStr);
                        let y = parseInt(yStr);

                        if (f === currentFloorId) {
                            if (edge === 'left' && change < 0 && x === 0) return;
                            if (edge === 'top' && change < 0 && y === 0) return;
                            if (edge === 'right' && change < 0 && x >= newCols) return;
                            if (edge === 'bottom' && change < 0 && y >= newRows) return;

                            if (dx !== 0) x += dx;
                            if (dy !== 0) y += dy;
                        }
                        newCells[`${f}:${x}:${y}`] = prev.cells[key];
                    });

                    if (newStartPos && newStartPos.floorId === currentFloorId) {
                        let sx = newStartPos.x;
                        let sy = newStartPos.y;
                        if (edge === 'left' && change < 0 && sx === 0) newStartPos = null;
                        else if (edge === 'top' && change < 0 && sy === 0) newStartPos = null;
                        else if (edge === 'right' && change < 0 && sx >= newCols) newStartPos = null;
                        else if (edge === 'bottom' && change < 0 && sy >= newRows) newStartPos = null;
                        else {
                            if (dx !== 0) sx += dx;
                            if (dy !== 0) sy += dy;
                            newStartPos = { ...newStartPos, x: sx, y: sy };
                        }
                    }

                    const newFloors = [...prev.floors];
                    newFloors[currentFloorIdx] = { ...floor, cols: newCols, rows: newRows };

                    const next = { ...prev, floors: newFloors, cells: newCells, startPos: newStartPos };
                    saveLayout(next);
                    return next;
                });
            }, [saveLayout, currentFloorId]);

            const checkAdjacency = useCallback((x, y, floorId, type, idField, idValue, layoutState) => {
                const existing = [];
                for (const [key, cell] of Object.entries(layoutState.cells)) {
                    const [f, cx, cy] = key.split(':');
                    if (f === floorId && cell.type === type && cell[idField] === idValue) {
                        existing.push({ x: parseInt(cx), y: parseInt(cy) });
                    }
                }
                if (existing.length === 0) return true;
                return existing.some(c => 
                    (Math.abs(c.x - x) === 1 && c.y === y) || 
                    (Math.abs(c.y - y) === 1 && c.x === x)
                );
            }, []);

            const handleAddFloor = () => {
                if(!newFloorName.trim()) return;
                setLayout(prev => {
                    const currentFloor = prev.floors.find(f => f.id === currentFloorId) || prev.floors[0];
                    const newFloor = { id: `f${Date.now()}`, name: newFloorName, order: prev.floors.length, cols: currentFloor.cols || prev.cols || 25, rows: currentFloor.rows || prev.rows || 15 };
                    const next = { ...prev, floors: [...prev.floors, newFloor] };
                    saveLayout(next); return next;
                });
                setNewFloorName('');
            };

            const handleDeleteFloor = (id) => {
                setLayout(prev => {
                    if (prev.floors.length <= 1) return prev; 
                    const newFloors = prev.floors.filter(f => f.id !== id);
                    const newCells = Object.fromEntries(Object.entries(prev.cells).filter(([k]) => !k.startsWith(`${id}:`)));
                    const next = { ...prev, floors: newFloors, cells: newCells };
                    saveLayout(next); return next;
                });
                if (currentFloorId === id) { setCurrentFloorId(layout.floors.filter(f => f.id !== id)[0].id); }
            };

            const handleRenameFloor = (id, newName) => {
                setLayout(prev => {
                    const next = { ...prev, floors: prev.floors.map(f => f.id === id ? {...f, name: newName} : f) };
                    saveLayout(next); return next;
                });
            };

            const applyTool = useCallback((x, y, floorId, isDrag = false) => {
                if (mode !== 'edit' || currentTool === 'pan' || currentTool === 'zone' || currentTool === 'eraser') return;
                
                setLayout(prevLayout => {
                    const cellKey = `${floorId}:${x}:${y}`;
                    const newLayout = { ...prevLayout, cells: { ...prevLayout.cells } };
                    const currentCell = newLayout.cells[cellKey] || {};

                    if (currentTool === 'bucket') {
                        if (isDrag) return prevLayout; 
                        const startZoneId = currentCell.zoneId || null;
                        if (startZoneId === selectedZoneId) return prevLayout;

                        const newCells = { ...prevLayout.cells };
                        const q = [{x, y}];
                        const visited = new Set([`${x}:${y}`]);
                        const currentFloorLayout = prevLayout.floors.find(f => f.id === floorId);
                        const maxCols = currentFloorLayout?.cols || prevLayout.cols || 25;
                        const maxRows = currentFloorLayout?.rows || prevLayout.rows || 15;

                        while(q.length > 0) {
                            const curr = q.shift();
                            const key = `${floorId}:${curr.x}:${curr.y}`;
                            const cell = newCells[key] || {};
                            newCells[key] = { ...cell, zoneId: selectedZoneId };

                            const dirs = [{dx:0,dy:-1}, {dx:1,dy:0}, {dx:0,dy:1}, {dx:-1,dy:0}];
                            for (const d of dirs) {
                                const nx = curr.x + d.dx, ny = curr.y + d.dy;
                                if (nx >= 0 && nx < maxCols && ny >= 0 && ny < maxRows) {
                                    const nKey = `${floorId}:${nx}:${ny}`;
                                    const nCell = newCells[nKey] || {};
                                    if ((nCell.zoneId || null) === startZoneId && nCell.type !== 'wall' && nCell.type !== 'stairs' && !visited.has(nKey)) {
                                        visited.add(nKey); q.push({x: nx, y: ny});
                                    }
                                }
                            }
                        }
                        newLayout.cells = newCells;
                    } else if (currentTool === 'start') {
                        if (isDrag) return prevLayout; 
                        if (newLayout.startPos) {
                            const oldKey = `${newLayout.startPos.floorId}:${newLayout.startPos.x}:${newLayout.startPos.y}`;
                            if (newLayout.cells[oldKey]) {
                                newLayout.cells[oldKey] = { ...newLayout.cells[oldKey], type: null };
                                if (!newLayout.cells[oldKey].zoneId) delete newLayout.cells[oldKey];
                            }
                        }
                        newLayout.cells[cellKey] = { ...currentCell, type: 'start' };
                        newLayout.startPos = { floorId, x, y };
                    } else if (currentTool === 'table') {
                        if (!checkAdjacency(x, y, floorId, 'table', 'tableId', activeTableId.toUpperCase(), newLayout)) {
                            if (!isDrag) setDrawError(`Action annulée : La table ${activeTableId.toUpperCase()} doit être connectée à ses autres parties.`);
                            return prevLayout;
                        }
                        if (currentCell.type === 'start') newLayout.startPos = null;
                        newLayout.cells[cellKey] = { ...currentCell, type: 'table', tableId: activeTableId.toUpperCase(), isRound: isRoundTable, stairId: null, orientation: null };
                    } else if (currentTool === 'stairs') {
                        if (!checkAdjacency(x, y, floorId, 'stairs', 'stairId', activeStairId.toUpperCase(), newLayout)) {
                            if (!isDrag) setDrawError(`Action annulée : L'escalier ${activeStairId.toUpperCase()} doit être connecté à ses autres parties.`);
                            return prevLayout;
                        }
                        if (currentCell.type === 'start') newLayout.startPos = null;
                        newLayout.cells[cellKey] = { ...currentCell, type: 'stairs', stairId: activeStairId.toUpperCase(), tableId: null, orientation: null, benchId: null };
                    } else if (currentTool === 'bench') {
                        if (isDrag) return prevLayout;
                        const adjacentBench = [ {dx:0, dy:-1}, {dx:1, dy:0}, {dx:0, dy:1}, {dx:-1, dy:0} ].map(d => prevLayout.cells[`${floorId}:${x+d.dx}:${y+d.dy}`]).find(c => c?.type === 'bench' && c.benchId);
                        if (adjacentBench) {
                            setBenchMergePrompt({ x, y, floorId, adjacentBenchId: adjacentBench.benchId }); return prevLayout;
                        } else {
                            if (currentCell.type === 'start') newLayout.startPos = null;
                            newLayout.cells[cellKey] = { ...currentCell, type: 'bench', benchId: Date.now().toString(), tableId: null, stairId: null, orientation: null };
                        }
                    } else if (currentTool === 'kiosk') {
                        if (isDrag) return prevLayout; 
                        for (const [key, cell] of Object.entries(newLayout.cells)) {
                            if (cell.type === 'kiosk' && cell.kioskId === activeKioskId.toUpperCase()) {
                                newLayout.cells[key] = { ...cell, type: null, kioskId: null, orientation: null };
                                if (!newLayout.cells[key].zoneId) delete newLayout.cells[key];
                            }
                        }
                        if (currentCell.type === 'start') newLayout.startPos = null;
                        newLayout.cells[cellKey] = { ...currentCell, type: 'kiosk', kioskId: activeKioskId.toUpperCase(), orientation: kioskOrientation, tableId: null, stairId: null, benchId: null };
                    } else {
                        if (currentCell.type === 'start') newLayout.startPos = null;
                        newLayout.cells[cellKey] = { ...currentCell, type: currentTool, tableId: null, stairId: null, orientation: null, benchId: null };
                    }
                    saveLayout(newLayout); return newLayout;
                });
            }, [mode, currentTool, selectedZoneId, activeTableId, isRoundTable, activeStairId, activeKioskId, kioskOrientation, saveLayout, checkAdjacency]);

            const handleGlobalPointerUp = () => {
                if (isDrawing && (currentTool === 'zone' || currentTool === 'eraser') && dragStart && dragCurrent) {
                    setLayout(prev => {
                        const newCells = {...prev.cells};
                        let newStartPos = prev.startPos;
                        const minX = Math.min(dragStart.x, dragCurrent.x), maxX = Math.max(dragStart.x, dragCurrent.x);
                        const minY = Math.min(dragStart.y, dragCurrent.y), maxY = Math.max(dragStart.y, dragCurrent.y);

                        for(let cx=minX; cx<=maxX; cx++) {
                            for(let cy=minY; cy<=maxY; cy++) {
                                const key = `${currentFloorId}:${cx}:${cy}`;
                                if (currentTool === 'zone') { newCells[key] = { ...(newCells[key]||{}), zoneId: selectedZoneId }; } 
                                else if (currentTool === 'eraser') {
                                    if (newCells[key]?.type === 'start') newStartPos = null;
                                    delete newCells[key];
                                }
                            }
                        }
                        const next = {...prev, cells: newCells, startPos: newStartPos};
                        saveLayout(next); return next;
                    });
                }
                setIsDrawing(false); setDragStart(null); setDragCurrent(null);
                if (mapContainerRef.current) {
                    mapContainerRef.current.isDragging = false;
                    mapContainerRef.current.style.cursor = (currentTool === 'pan' || mode === 'service') ? 'grab' : 'crosshair';
                }
            };

            const handlePointerDown = (x, y) => { 
                if (currentTool === 'zone' || currentTool === 'eraser') { setDragStart({x, y}); setDragCurrent({x, y}); setIsDrawing(true); } 
                else { setIsDrawing(true); applyTool(x, y, currentFloorId, false); }
            };

            const handlePointerEnter = (x, y) => { 
                if (isDrawing) {
                    if (currentTool === 'zone' || currentTool === 'eraser') { setDragCurrent({x, y}); } 
                    else { applyTool(x, y, currentFloorId, true); }
                }
            };

            const handleBenchMergeDecision = (merge) => {
                if (!benchMergePrompt) return;
                const { x, y, floorId, adjacentBenchId } = benchMergePrompt;
                setLayout(prevLayout => {
                    const cellKey = `${floorId}:${x}:${y}`;
                    const newLayout = { ...prevLayout, cells: { ...prevLayout.cells } };
                    const currentCell = newLayout.cells[cellKey] || {};
                    if (currentCell.type === 'start') newLayout.startPos = null;
                    newLayout.cells[cellKey] = { ...currentCell, type: 'bench', benchId: merge ? adjacentBenchId : Date.now().toString(), tableId: null, stairId: null, orientation: null };
                    saveLayout(newLayout); return newLayout;
                });
                setBenchMergePrompt(null);
            };

            const addZone = () => {
                if (!newZoneName.trim()) return;
                setLayout(prev => {
                    const newZ = { id: `z${Date.now()}`, name: newZoneName, color: newZoneColor };
                    const next = { ...prev, zones: [...prev.zones, newZ] };
                    saveLayout(next); return next;
                });
                setNewZoneName('');
            };

            const deleteZone = (zoneId) => {
                setLayout(prev => {
                    const next = { 
                        ...prev, zones: prev.zones.filter(z => z.id !== zoneId),
                        cells: Object.fromEntries(Object.entries(prev.cells).map(([key, cell]) => [key, cell.zoneId === zoneId ? { ...cell, zoneId: null } : cell]).filter(([_, cell]) => cell.type || cell.zoneId))
                    };
                    saveLayout(next); return next;
                });
                if (selectedZoneId === zoneId) setSelectedZoneId(null);
            };

            const resetService = useCallback(() => {
                setTargetTable(''); setPath([]); setPathMessage(null); setPathInstructions([]);
                const rdc = layout.floors.sort((a,b) => a.order - b.order)[0];
                if (rdc) setCurrentFloorId(rdc.id);
            }, [layout.floors]);

            const triggerRoute = (targetNum) => {
                calculatePath(targetNum);
                if (rushTimeoutRef.current) clearTimeout(rushTimeoutRef.current);
                rushTimeoutRef.current = setTimeout(() => { resetService(); }, 15000);
            };

            const calculatePath = (targetNum) => {
                if (!layout.startPos) { setPathMessage({ type: 'error', text: 'Point de départ non défini.' }); return; }

                let targetPositions = [];
                for (const [key, cell] of Object.entries(layout.cells)) {
                    if (cell.type === 'table' && cell.tableId === targetNum) {
                        const [floorId, x, y] = key.split(':'); targetPositions.push({ floorId, x: parseInt(x), y: parseInt(y) });
                    }
                }
                if (targetPositions.length === 0) { setPathMessage({ type: 'error', text: `Table ${targetNum} introuvable.` }); setPath([]); return; }

                const pq = [{ pos: layout.startPos, path: [layout.startPos], cost: 0 }];
                const costs = new Map(); costs.set(`${layout.startPos.floorId}:${layout.startPos.x}:${layout.startPos.y}`, 0);
                const dirs = [ {dx:0, dy:-1}, {dx:1, dy:0}, {dx:0, dy:1}, {dx:-1, dy:0} ];
                let foundPath = null;

                while (pq.length > 0) {
                    pq.sort((a, b) => a.cost - b.cost); 
                    const { pos, path, cost } = pq.shift();
                    
                    if (targetPositions.some(t => t.floorId === pos.floorId && t.x === pos.x && t.y === pos.y)) { foundPath = path; break; }

                    const posFloorLayout = layout.floors.find(f => f.id === pos.floorId);
                    const maxCols = posFloorLayout?.cols || layout.cols || 25, maxRows = posFloorLayout?.rows || layout.rows || 15;

                    for (const d of dirs) {
                        const nx = pos.x + d.dx, ny = pos.y + d.dy;
                        if (nx >= 0 && nx < maxCols && ny >= 0 && ny < maxRows) {
                            const nextFloorId = pos.floorId, key = `${nextFloorId}:${nx}:${ny}`, cell = layout.cells[key];
                            const isTargetNext = targetPositions.some(t => t.floorId === nextFloorId && t.x === nx && t.y === ny);
                            let walkable = !cell || !cell.type || ['door', 'start', 'stairs'].includes(cell.type) || isTargetNext;
                            let stepCost = 1; 
                            if (cell && ['stool', 'chair', 'bench'].includes(cell.type)) { walkable = true; stepCost = 1000; }
                            
                            if (walkable) {
                                const newCost = cost + stepCost;
                                if (!costs.has(key) || newCost < costs.get(key)) {
                                    costs.set(key, newCost); pq.push({ pos: { floorId: nextFloorId, x: nx, y: ny }, path: [...path, { floorId: nextFloorId, x: nx, y: ny }], cost: newCost });
                                }
                            }
                        }
                    }

                    const currentCell = layout.cells[`${pos.floorId}:${pos.x}:${pos.y}`];
                    if (currentCell?.type === 'stairs' && currentCell.stairId) {
                        for (const [key, cell] of Object.entries(layout.cells)) {
                            if (cell.type === 'stairs' && cell.stairId === currentCell.stairId) {
                                const [sFloorId, sx, sy] = key.split(':');
                                if (sFloorId !== pos.floorId) {
                                    const newCost = cost + 1; 
                                    if (!costs.has(key) || newCost < costs.get(key)) {
                                        costs.set(key, newCost); pq.push({ pos: { floorId: sFloorId, x: parseInt(sx), y: parseInt(sy) }, path: [...path, { floorId: sFloorId, x: parseInt(sx), y: parseInt(sy) }], cost: newCost });
                                    }
                                }
                            }
                        }
                    }
                }

                if (foundPath) {
                    setPath(foundPath);
                    let instructions = [], currentSegmentFloor = layout.startPos.floorId;
                    const floorNames = layout.floors.reduce((acc, f) => ({...acc, [f.id]: f.name}), {});
                    
                    instructions.push({ floorId: currentSegmentFloor, text: `Départ : ${floorNames[currentSegmentFloor]}` });
                    for (let i = 1; i < foundPath.length; i++) {
                        if (foundPath[i].floorId !== currentSegmentFloor) {
                            const prevCell = layout.cells[`${foundPath[i-1].floorId}:${foundPath[i-1].x}:${foundPath[i-1].y}`];
                            instructions.push({ floorId: currentSegmentFloor, text: `Prendre l'escalier ${prevCell?.stairId || "?"}` });
                            currentSegmentFloor = foundPath[i].floorId;
                            instructions.push({ floorId: currentSegmentFloor, text: `Arrivée : ${floorNames[currentSegmentFloor]}` });
                        }
                    }
                    instructions.push({ floorId: currentSegmentFloor, text: `Arrivée à la table ${targetNum}` });
                    
                    setPathInstructions(instructions);
                    setPathMessage({ type: 'success', text: `En route vers la table ${targetNum} (Retour auto 15s).` });
                    setCurrentFloorId(foundPath[foundPath.length - 1].floorId);
                } else {
                    setPath([]); setPathMessage({ type: 'error', text: `Chemin bloqué vers la table ${targetNum}.` });
                }
            };

            const handleServiceNumpad = (val) => {
                if (rushTimeoutRef.current) clearTimeout(rushTimeoutRef.current); 
                if (val === 'C') { resetService(); } 
                else if (val === 'GO') { if (targetTable) triggerRoute(targetTable); } 
                else {
                    const newVal = (targetTable + val).slice(0, 3); setTargetTable(newVal);
                    if (newVal.length === 3) triggerRoute(newVal); 
                }
            };

            const currentFloor = layout.floors.find(f => f.id === currentFloorId) || layout.floors[0];
            const floorCols = currentFloor.cols || layout.cols || 25, floorRows = currentFloor.rows || layout.rows || 15;
            const sortedFloors = [...layout.floors].sort((a, b) => b.order - a.order);

            const floorGroups = useMemo(() => {
                const tables = {}, stairs = {}, zonesCells = {};
                Object.entries(layout.cells).forEach(([key, cell]) => {
                    const [fId, xStr, yStr] = key.split(':');
                    if (fId !== currentFloorId) return;
                    const x = parseInt(xStr), y = parseInt(yStr);

                    if (cell.type === 'table' && cell.tableId) {
                        if(!tables[cell.tableId]) tables[cell.tableId] = { minX: x, maxX: x, minY: y, maxY: y };
                        else {
                            tables[cell.tableId].minX = Math.min(tables[cell.tableId].minX, x); tables[cell.tableId].maxX = Math.max(tables[cell.tableId].maxX, x);
                            tables[cell.tableId].minY = Math.min(tables[cell.tableId].minY, y); tables[cell.tableId].maxY = Math.max(tables[cell.tableId].maxY, y);
                        }
                    }
                    if (cell.type === 'stairs' && cell.stairId) {
                        if(!stairs[cell.stairId]) stairs[cell.stairId] = { minX: x, maxX: x, minY: y, maxY: y };
                        else {
                            stairs[cell.stairId].minX = Math.min(stairs[cell.stairId].minX, x); stairs[cell.stairId].maxX = Math.max(stairs[cell.stairId].maxX, x);
                            stairs[cell.stairId].minY = Math.min(stairs[cell.stairId].minY, y); stairs[cell.stairId].maxY = Math.max(stairs[cell.stairId].maxY, y);
                        }
                    }
                    if (cell.zoneId) {
                        if (!zonesCells[cell.zoneId]) zonesCells[cell.zoneId] = [];
                        zonesCells[cell.zoneId].push({ x, y });
                    }
                });

                const formatGroup = (dict) => Object.entries(dict).map(([id, data]) => ({ id, minX: data.minX, minY: data.minY, w: data.maxX - data.minX + 1, h: data.maxY - data.minY + 1 }));

                const formatZones = () => {
                    const zonesLabels = [];
                    const obstacles = new Set(), zoneCellsMap = new Map();

                    Object.entries(layout.cells).forEach(([k, c]) => {
                        const [f, xStr, yStr] = k.split(':');
                        if (f === currentFloorId) {
                            if (c.type && ['wall', 'stairs', 'table', 'chair', 'stool', 'bench', 'kiosk'].includes(c.type)) obstacles.add(`${parseInt(xStr)}:${parseInt(yStr)}`);
                            if (c.zoneId) zoneCellsMap.set(`${parseInt(xStr)}:${parseInt(yStr)}`, c.zoneId);
                        }
                    });

                    for (const [id, cells] of Object.entries(zonesCells)) {
                        const zData = layout.zones.find(z => z.id === id);
                        if (!zData) continue;
                        
                        let bestCell = cells[0], maxDist = -1;
                        for (const c of cells) {
                            let minDist = Math.min(c.x + 1, floorCols - c.x, c.y + 1, floorRows - c.y);
                            for (let y = 0; y < floorRows; y++) {
                                for (let x = 0; x < floorCols; x++) {
                                    if (obstacles.has(`${x}:${y}`) || zoneCellsMap.get(`${x}:${y}`) !== id) {
                                        const d = Math.sqrt(Math.pow(c.x - x, 2) + Math.pow(c.y - y, 2));
                                        if (d < minDist) minDist = d;
                                    }
                                }
                            }
                            if (minDist > maxDist) { maxDist = minDist; bestCell = c; } 
                            else if (minDist === maxDist) {
                                const cx = cells.reduce((sum, cl) => sum + cl.x, 0) / cells.length, cy = cells.reduce((sum, cl) => sum + cl.y, 0) / cells.length;
                                if ((Math.pow(c.x - cx, 2) + Math.pow(c.y - cy, 2)) < (Math.pow(bestCell.x - cx, 2) + Math.pow(bestCell.y - cy, 2))) bestCell = c;
                            }
                        }
                        zonesLabels.push({ id, name: zData.name, color: zData.color, x: bestCell.x, y: bestCell.y, radius: maxDist, size: cells.length });
                    }
                    return zonesLabels;
                };

                return { tables: formatGroup(tables), stairs: formatGroup(stairs), zones: formatZones() };
            }, [layout.cells, currentFloorId, layout.zones, floorCols, floorRows]);

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-[#f9f8f4] text-[#8e6331] font-bold">Chargement du plan...</div>;

            return (
                <div className="h-[100dvh] flex flex-col bg-[#f9f8f4] text-[#2d2822] font-sans select-none overflow-hidden" 
                     onPointerUp={handleGlobalPointerUp} onPointerLeave={handleGlobalPointerUp}>
                    
                    {drawError && (
                        <div className="fixed top-4 sm:top-8 left-1/2 transform -translate-x-1/2 z-50 bg-red-600/95 backdrop-blur text-white px-4 sm:px-6 py-2 sm:py-3 rounded-full shadow-lg font-bold text-sm sm:text-base animate-in fade-in slide-in-from-top-4">
                            {drawError}
                        </div>
                    )}

                    {benchMergePrompt && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-xl max-w-sm w-full border border-[#e6e2da]">
                            <h3 className="text-lg sm:text-xl font-bold text-[#2d2822] mb-2 text-center">Fusionner les bancs ?</h3>
                            <p className="text-[#7a7266] text-xs sm:text-sm text-center mb-6">Voulez-vous lier ces bancs pour créer une banquette continue ?</p>
                            <div className="flex gap-3">
                            <button onClick={() => handleBenchMergeDecision(false)} className="flex-1 py-2 sm:py-3 rounded-xl border border-[#e6e2da] bg-[#f9f8f4] text-[#7a7266] font-bold text-sm sm:text-base hover:bg-[#f4f2ec]">Non, séparés</button>
                            <button onClick={() => handleBenchMergeDecision(true)} className="flex-1 py-2 sm:py-3 rounded-xl bg-[#c17a23] text-white font-bold text-sm sm:text-base hover:bg-[#a6681e] shadow-md">Oui, fusionner</button>
                            </div>
                        </div>
                        </div>
                    )}

                    <header className="px-4 py-3 sm:px-8 sm:py-6 flex-shrink-0 z-10 bg-[#f9f8f4]">
                        <div className="flex justify-between items-center mb-2 sm:mb-4">
                            <div className="flex items-center gap-3">
                                <img src="./icon.png" alt="Logo" className="w-8 h-8 sm:w-12 sm:h-12 rounded-xl shadow-sm object-cover" onError={(e) => e.target.style.display='none'} />
                                <h1 className="text-xl sm:text-4xl font-bold tracking-tight">DigiSAT · Salle</h1>
                            </div>
                            <div className="flex items-center gap-1 sm:gap-2 bg-[#d1f4e0] text-[#0f766e] px-2 py-1 sm:px-4 sm:py-1.5 rounded-full text-xs sm:text-sm font-bold border border-[#a7f3d0]">
                                <span className="h-1.5 w-1.5 sm:h-2 sm:w-2 rounded-full bg-[#10b981]"></span> En Ligne
                            </div>
                        </div>
                        <div className="h-[2px] w-full bg-[#2d2822] mb-3 sm:mb-6"></div>

                        <div className="flex flex-row gap-2 sm:gap-4">
                            <button onClick={() => { setMode('edit'); resetService(); }}
                                className={`flex-1 py-2 sm:py-4 px-2 sm:px-4 rounded-xl border font-bold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-sm ${
                                mode === 'edit' ? 'border-[#c17a23] bg-[#fffbf4] text-[#c17a23]' : 'border-[#e6e2da] bg-white text-[#7a7266] hover:bg-gray-50'
                                }`}
                            >
                                <i className="fas fa-cog hidden sm:block"></i> Paramètres du Plan
                            </button>
                            <button onClick={() => setMode('service')}
                                className={`flex-1 py-2 sm:py-4 px-2 sm:px-4 rounded-xl border font-bold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-sm ${
                                mode === 'service' ? 'border-[#c17a23] bg-[#fffbf4] text-[#c17a23]' : 'border-[#e6e2da] bg-white text-[#7a7266] hover:bg-gray-50'
                                }`}
                            >
                                <i className="fas fa-location-arrow hidden sm:block"></i> Mode Service
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col lg:flex-row px-2 sm:px-8 pb-2 sm:pb-8 gap-3 sm:gap-8 overflow-hidden relative">
                        
                        <section className="order-1 lg:order-2 flex-1 relative flex flex-col bg-white rounded-xl sm:rounded-2xl border border-[#e6e2da] shadow-sm overflow-hidden p-2 sm:p-6 h-[50vh] lg:h-auto">
                            
                            <div className="absolute top-2 right-2 sm:top-6 sm:right-6 z-40 flex flex-col gap-2">
                                <div className="bg-white/90 backdrop-blur p-1.5 sm:p-2 rounded-xl border border-[#e6e2da] shadow-sm flex flex-col gap-1 sm:gap-2">
                                    {sortedFloors.map(f => (
                                        <button key={f.id} onClick={() => setCurrentFloorId(f.id)}
                                            className={`w-10 h-10 sm:w-14 sm:h-12 flex items-center justify-center rounded-lg font-bold text-[10px] sm:text-sm transition-all border ${
                                                currentFloorId === f.id ? 'border-[#c17a23] bg-[#c17a23] text-white shadow-md' : 'border-[#e6e2da] bg-white text-[#7a7266]'
                                            }`}
                                        >
                                            {f.name.substring(0,3)}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="absolute bottom-2 right-2 sm:bottom-6 sm:right-6 z-40 flex gap-1 sm:gap-2 bg-white/90 backdrop-blur p-1.5 sm:p-2 rounded-xl border border-[#e6e2da] shadow-sm">
                                <button onClick={() => setRotation(r => (r + 90) % 360)} className="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-[#7a7266] bg-[#f9f8f4] hover:bg-[#e6e2da] rounded-lg font-bold transition-colors">
                                    <i className="fas fa-rotate-right"></i>
                                </button>
                                <div className="w-px bg-[#e6e2da] mx-0.5 sm:mx-1"></div>
                                <button onClick={() => setZoom(z => Math.max(0.5, z - 0.2))} className="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-[#7a7266] bg-[#f9f8f4] hover:bg-[#e6e2da] rounded-lg font-bold text-lg sm:text-xl transition-colors">-</button>
                                <div className="w-12 sm:w-16 flex items-center justify-center font-bold text-[#2d2822] text-xs sm:text-sm">{Math.round(zoom * 100)}%</div>
                                <button onClick={() => setZoom(z => Math.min(4, z + 0.2))} className="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-[#7a7266] bg-[#f9f8f4] hover:bg-[#e6e2da] rounded-lg font-bold text-lg sm:text-xl transition-colors">+</button>
                            </div>

                            <div className="mb-2 sm:mb-4 text-[#2d2822] font-bold text-sm sm:text-xl uppercase tracking-wide">Plan - {currentFloor?.name}</div>

                            {/* Map Area */}
                            <div ref={mapContainerRef} 
                                className={`w-full flex-1 overflow-auto custom-scrollbar p-0 bg-[#faf9f7] rounded-xl border border-[#e6e2da] inner-shadow relative ${mode === 'edit' && currentTool !== 'pan' ? 'touch-none' : ''}`}
                                style={{ cursor: (currentTool === 'pan' || mode === 'service') ? 'grab' : 'crosshair' }}
                                onPointerDown={(e) => {
                                    if (currentTool === 'pan' || mode === 'service') {
                                        mapContainerRef.current.isDragging = true;
                                        mapContainerRef.current.startX = e.clientX + mapContainerRef.current.scrollLeft;
                                        mapContainerRef.current.startY = e.clientY + mapContainerRef.current.scrollTop;
                                        mapContainerRef.current.style.cursor = 'grabbing';
                                    }
                                }}
                                onPointerMove={(e) => {
                                    if ((currentTool === 'pan' || mode === 'service') && mapContainerRef.current?.isDragging) {
                                        mapContainerRef.current.scrollLeft = mapContainerRef.current.startX - e.clientX;
                                        mapContainerRef.current.scrollTop = mapContainerRef.current.startY - e.clientY;
                                    }
                                }}
                            >
                                <div className="min-w-full min-h-full flex p-4 sm:p-8">
                                    <div className="m-auto relative transition-all duration-300"
                                        style={{ width: `${(rotation === 90 || rotation === 270 ? floorRows : floorCols) * 40 * baseScale * zoom}px`, height: `${(rotation === 90 || rotation === 270 ? floorCols : floorRows) * 40 * baseScale * zoom}px`}}>
                                        <div className={`absolute top-1/2 left-1/2 shadow-sm transition-transform duration-300 origin-center ${mode === 'edit' && currentTool !== 'pan' ? 'touch-none' : ''}`}
                                            style={{ width: `${floorCols * 40}px`, height: `${floorRows * 40}px`, transform: `translate(-50%, -50%) scale(${baseScale * zoom}) rotate(${rotation}deg)` }}>
                                            
                                            <div className="absolute inset-0 border-t border-l border-[#e6e2da] bg-[#f4f2ec]">
                                                <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                                                    <defs><pattern id="grid" width={100/floorCols + "%"} height={100/floorRows + "%"} patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6e2da" strokeWidth="1"/></pattern></defs>
                                                    <rect width="100%" height="100%" fill="url(#grid)" />
                                                </svg>
                                            </div>

                                            <div className="absolute inset-0 grid z-[2]" style={{ gridTemplateColumns: `repeat(${floorCols}, 1fr)`, gridTemplateRows: `repeat(${floorRows}, 1fr)` }}>
                                                {Array.from({ length: floorRows }).map((_, y) => 
                                                    Array.from({ length: floorCols }).map((_, x) => {
                                                        const cellKey = `${currentFloorId}:${x}:${y}`;
                                                        const cellData = layout.cells[cellKey];
                                                        if (!cellData?.zoneId) return <div key={`bg-${cellKey}`} className="pointer-events-none" />;
                                                        const zData = layout.zones.find(z => z.id === cellData.zoneId);
                                                        if (!zData) return <div key={`bg-${cellKey}`} className="pointer-events-none" />;
                                                        const hexToRgba = (hex, alpha) => { const r = parseInt(hex.slice(1, 3), 16) || 0; const g = parseInt(hex.slice(3, 5), 16) || 0; const b = parseInt(hex.slice(5, 7), 16) || 0; return `rgba(${r}, ${g}, ${b}, ${alpha})`; };
                                                        return <div key={`bg-${cellKey}`} className="relative w-full h-full pointer-events-none" style={{ backgroundColor: hexToRgba(zData.color, 0.35) }} />;
                                                    })
                                                )}
                                            </div>

                                            {isDrawing && ['zone', 'eraser'].includes(currentTool) && dragStart && dragCurrent && (
                                                <div className="absolute z-[4] pointer-events-none" style={{ left: `${Math.min(dragStart.x, dragCurrent.x) * 40}px`, top: `${Math.min(dragStart.y, dragCurrent.y) * 40}px`, width: `${(Math.abs(dragCurrent.x - dragStart.x) + 1) * 40}px`, height: `${(Math.abs(dragCurrent.y - dragStart.y) + 1) * 40}px`, backgroundColor: currentTool === 'zone' ? 'rgba(59, 130, 246, 0.2)' : 'rgba(239, 68, 68, 0.2)', border: `3px solid ${currentTool === 'zone' ? '#3b82f6' : '#ef4444'}`, boxShadow: '0 0 15px rgba(0,0,0,0.1)' }} />
                                            )}

                                            <div className="absolute inset-0 pointer-events-none z-[5]">
                                                {floorGroups.zones.map(z => {
                                                    const fontSizePx = Math.max(14, Math.min(45, z.radius * 12 + 10));
                                                    return (
                                                        <div key={`z-${z.id}`} className="absolute pointer-events-none overflow-visible" style={{ left: `${(z.x / floorCols) * 100}%`, top: `${(z.y / floorRows) * 100}%`, width: `${(1 / floorCols) * 100}%`, height: `${(1 / floorRows) * 100}%` }}>
                                                            <div className="absolute top-1/2 left-1/2 flex items-center justify-center transition-transform duration-300" style={{ transform: `translate(-50%, -50%) rotate(${-rotation}deg)` }}>
                                                                <span className="font-black uppercase whitespace-nowrap text-center" style={{ color: z.color, fontSize: `${fontSizePx}px`, letterSpacing: '0.05em', textShadow: '0 0 8px rgba(249,248,244,1), 0 0 15px rgba(249,248,244,1), 0 0 4px rgba(249,248,244,1)', opacity: 0.95 }}>{z.name}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            <div className="absolute inset-0 grid z-10" style={{ gridTemplateColumns: `repeat(${floorCols}, 1fr)`, gridTemplateRows: `repeat(${floorRows}, 1fr)` }}>
                                                {Array.from({ length: floorRows }).map((_, y) => 
                                                    Array.from({ length: floorCols }).map((_, x) => {
                                                        const cellKey = `${currentFloorId}:${x}:${y}`;
                                                        const cellData = layout.cells[cellKey];
                                                        const rightCell = layout.cells[`${currentFloorId}:${x+1}:${y}`];
                                                        const bottomCell = layout.cells[`${currentFloorId}:${x}:${y+1}`];
                                                        const leftCell = layout.cells[`${currentFloorId}:${x-1}:${y}`];
                                                        const topCell = layout.cells[`${currentFloorId}:${x}:${y-1}`];
                                                        
                                                        const mergeRight = cellData && rightCell && cellData.type === rightCell.type && (cellData.type === 'wall' || cellData.type === 'trash' || (cellData.type === 'table' && cellData.tableId && cellData.tableId === rightCell.tableId) || (cellData.type === 'stairs' && cellData.stairId && cellData.stairId === rightCell.stairId));
                                                        const mergeBottom = cellData && bottomCell && cellData.type === bottomCell.type && (cellData.type === 'wall' || cellData.type === 'trash' || (cellData.type === 'table' && cellData.tableId && cellData.tableId === bottomCell.tableId) || (cellData.type === 'stairs' && cellData.stairId && cellData.stairId === bottomCell.stairId));
                                                        const isPath = path.some(p => p.floorId === currentFloorId && p.x === x && p.y === y);
                                                        const zColor = cellData?.zoneId ? layout.zones.find(z => z.id === cellData.zoneId)?.color : null;

                                                        return (
                                                            <div key={cellKey} className="relative w-full h-full" onPointerDown={(e) => { if (currentTool === 'pan' || mode === 'service') return; e.preventDefault(); handlePointerDown(x, y); }} onPointerEnter={(e) => { if (currentTool === 'pan' || mode === 'service') return; e.preventDefault(); handlePointerEnter(x, y); }}>
                                                                {cellData?.type && TOOLS[cellData.type.toUpperCase()] && !['kiosk', 'bench', 'trash'].includes(cellData.type) && (() => {
                                                                    let bgColorClass = TOOLS[cellData.type.toUpperCase()]?.color;
                                                                    let bgStyle = { top: 0, left: 0, right: mergeRight ? '-1.5px' : '0', bottom: mergeBottom ? '-1.5px' : '0' };
                                                                    if (['table', 'chair', 'stool'].includes(cellData.type)) { if (zColor) { bgColorClass = ''; bgStyle.backgroundColor = zColor; bgStyle.filter = 'brightness(0.7) saturate(1.5)'; } }
                                                                    if (cellData.type === 'wall' || cellData.type === 'stairs') { bgColorClass = 'bg-stone-600'; bgStyle.backgroundColor = ''; bgStyle.filter = 'none'; }

                                    <div className="text-4xl sm:text-6xl font-sans font-bold text-[#c17a23] bg-[#fffbf4] border border-[#c17a23] rounded-xl min-h-[60px] sm:min-h-[100px] flex items-center justify-center tracking-widest shadow-inner">{targetTable || <span className="text-[#c17a23]/20">...</span>}</div>
                                    </div>
                                    {pathMessage && (<div className={`p-2 sm:p-4 mb-2 sm:mb-4 rounded-xl text-xs sm:text-sm font-bold text-center border ${pathMessage.type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-[#eef8ff] text-[#0369a1] border-[#bae6fd]'}`}>{pathMessage.text}</div>)}
                                    {pathInstructions.length > 0 && (
                                    <div className="flex flex-col gap-2 max-h-[120px] sm:max-h-[200px] overflow-y-auto custom-scrollbar pr-2 animate-in fade-in">
                                        <h3 className="text-[10px] font-bold text-[#a59a8c] uppercase tracking-wider mb-1">Itinéraire détaillé</h3>
                                        {pathInstructions.map((step, idx) => (
                                        <button key={idx} onClick={() => setCurrentFloorId(step.floorId)} className={`text-left p-2 sm:p-3 rounded-xl text-xs sm:text-sm font-bold transition-all border flex items-center gap-2 sm:gap-3 shadow-sm ${currentFloorId === step.floorId ? 'border-[#c17a23] bg-[#fffbf4] text-[#c17a23]' : 'border-[#e6e2da] bg-white text-[#7a7266]'}`}>
                                            <div className={`w-5 h-5 sm:w-6 sm:h-6 flex-shrink-0 rounded-full flex items-center justify-center text-[10px] sm:text-xs text-white ${currentFloorId === step.floorId ? 'bg-[#c17a23]' : 'bg-[#d6cfc2]'}`}>{idx + 1}</div>{step.text}
                                        </button>
                                        ))}
                                    </div>
                                    )}
                                </div>
                                <div className="grid grid-cols-3 gap-2 mt-2 sm:mt-4">
                                    {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (<button key={num} onClick={() => handleServiceNumpad(num.toString())} className="bg-white border border-[#e6e2da] active:bg-[#f4f2ec] text-[#2d2822] text-xl sm:text-2xl font-bold py-3 sm:py-5 rounded-xl shadow-sm transition-transform active:scale-95">{num}</button>))}
                                    <button onClick={() => handleServiceNumpad('C')} className="bg-[#f4f2ec] border border-[#e6e2da] text-[#7a7266] text-lg sm:text-xl font-bold py-3 sm:py-5 rounded-xl shadow-sm active:scale-95">CLR</button>
                                    <button onClick={() => handleServiceNumpad('0')} className="bg-white border border-[#e6e2da] text-[#2d2822] text-xl sm:text-2xl font-bold py-3 sm:py-5 rounded-xl shadow-sm active:scale-95">0</button>
                                    <button onClick={() => handleServiceNumpad('GO')} className="bg-[#c17a23] text-white text-lg sm:text-xl font-bold py-3 sm:py-5 rounded-xl shadow-sm active:scale-95">GO</button>
                                </div>
                                </div>
                            )}
                        </aside>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // On vérifie qu'on est sur un vrai site (http ou https) avant de lancer le Service Worker
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker enregistré !', reg))
                    .catch(err => console.error('Erreur Service Worker :', err));
            });
        } else {
            console.log('Service Worker ignoré (environnement de test).');
        }
    </script>
</body>
</html>
